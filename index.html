<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#00703A">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>息息相通｜RCC 以病人為中心的溝通平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4EC; --tile:#FFFDF8; --ink:#1A1A1A; --muted:#4A4A4A; --line:#3A3A3A; --divider:#D6D0C2;
  --c-need:#1F4E9A; --c-pain:#B3261E; --c-breath:#C25E00; --c-mood:#A3165B; --c-write:#2E6B30; --c-relax:#0F6E6E; --c-ask:#7A4B00;
  --b-home:#1F4E9A; --b-again:#4A4A4A; --b-stop:#1A1A1A; --b-ink:#FFFFFF;
  --conf-bg:#E6EDF7; --conf-line:#1F4E9A; --conf-ink:#163A73;
  --safe-bg:#FBF4DF; --safe-line:#8A7A4A; --safe-ink:#4A3A08;
  --logo-line:#9A9486; --logo-ink:#6B6658; --hosp:#00703A; --hosp-bg:#E8F3EC;
  --lv0-l:#2E6B30; --lv0-b:#E3F0E3; --lv1-l:#4F7A1F; --lv1-b:#ECF3DE; --lv2-l:#9A6B00; --lv2-b:#FAF0D2;
  --lv3-l:#B35400; --lv3-b:#FBE5D0; --lv4-l:#B23A12; --lv4-b:#F8DDD2; --lv5-l:#A31D1D; --lv5-b:#F5D6D4;
  --scale:1;
}
body.night{
  --bg:#1E1E1E; --tile:#2A2A2A; --ink:#F2EDE3; --muted:#CFC9BE; --line:#8A8A8A; --divider:#444;
  --c-need:#7FA7E0; --c-pain:#E58A84; --c-breath:#E8A160; --c-mood:#E07AAE; --c-write:#7CBF7E; --c-relax:#6CC4C4; --c-ask:#D9A55A;
  --b-home:#3A64A8; --b-again:#5A5A5A; --b-stop:#000000;
  --conf-bg:#24324A; --conf-line:#7FA7E0; --conf-ink:#DCE6F6;
  --safe-bg:#3A3320; --safe-line:#B8A66A; --safe-ink:#F1E3B5;
  --logo-line:#8A8A8A; --logo-ink:#CFC9BE; --hosp:#6FCB94; --hosp-bg:#1E2B23;
  --lv0-l:#7CBF7E; --lv0-b:#26332A; --lv1-l:#A6C46A; --lv1-b:#2D3324; --lv2-l:#E3C15A; --lv2-b:#363022;
  --lv3-l:#E8A160; --lv3-b:#3A2D22; --lv4-l:#EA8B6B; --lv4-b:#3A2622; --lv5-l:#E58A84; --lv5-b:#3A2222;
}
body.big{--scale:1.15}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;font-size:calc(16px * var(--scale));line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
svg{stroke:currentColor}
.helper-btn svg{width:1.4rem;height:1.4rem}
#app{max-width:1200px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:14px 16px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px}
.top-l{display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;flex-shrink:0}
.logo img{display:block}
.lg-s{height:46px;width:46px}
.lg-h{display:none!important;height:48px;width:auto}
body.night .logo,body.night .foot-logo{background:#F7F4EC;border-radius:10px;padding:4px 8px}
.foot-logo{display:block;margin:0 auto;width:min(320px,85%);height:auto}
.clock{font-size:1.25rem;font-weight:700}
.helper-btn{height:48px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--muted);font-size:1.05rem;font-weight:500;display:flex;align-items:center;gap:6px}
main{flex:1;display:flex;flex-direction:column;gap:16px;padding-top:8px}
.title{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0}
.title h1{margin:0;font-size:2.1rem;font-weight:900}
.title svg{width:2.4rem;height:2.4rem}
.sub{text-align:center;margin:0;font-size:1.25rem;font-weight:500;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{min-height:calc(9.5rem * var(--scale));border-radius:20px;border:3px solid var(--cc,var(--line));background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px 8px;text-align:center;transition:transform .08s,background .15s}
.tile svg{width:3.6rem;height:3.6rem;stroke:var(--cc,var(--ink))}
.tile .lb{font-size:1.85rem;font-weight:900;line-height:1.2}
.tile .sm{font-size:1.2rem;font-weight:500;color:var(--muted)}
.tile.more{border-style:dashed}
.tile:active,.lvl:active,.pill:active,button:active{transform:scale(.97)}
.seg button.flash,.btn.flash,.pill.flash,.key.flash,.back.flash,.helper-btn.flash{background:var(--b-home)!important;color:#fff!important;border-color:var(--b-home)!important}
.bar button.flash{filter:brightness(1.35)}
.tile.flash,.lvl.flash{background:var(--conf-bg)}
.tile.sel{background:var(--conf-bg);border-width:5px}
.wide{grid-column:1/-1}
body.latin .tile .lb,body.latin .lvl span{font-size:1.45rem;line-height:1.25}
body.latin .row2 .btn,body.latin .btn{font-size:1.25rem}
@media (min-width:760px){body.latin .tile .lb,body.latin .mgrid .tile .lb{font-size:1.75rem}body.latin .lvls.h .lvl span{font-size:1.35rem}}
.mgrid .tile{min-height:calc(8.4rem * var(--scale))}
.tile.short{min-height:5.2rem!important;flex-direction:row;gap:14px}
.tile.short svg{width:2.8rem!important;height:2.8rem!important}
.lvls{display:flex;flex-direction:column;gap:10px}
.lvl{min-height:calc(5.2rem * var(--scale));border-radius:18px;border:3px solid var(--l);background:var(--b);display:flex;align-items:center;gap:16px;padding:0 18px;text-align:left}
.lvl svg{width:3.4rem;height:3.4rem;stroke:var(--l);flex-shrink:0}
.lvl span{font-size:1.85rem;font-weight:900}
.lv0{--l:var(--lv0-l);--b:var(--lv0-b)}.lv1{--l:var(--lv1-l);--b:var(--lv1-b)}.lv2{--l:var(--lv2-l);--b:var(--lv2-b)}
.lv3{--l:var(--lv3-l);--b:var(--lv3-b)}.lv4{--l:var(--lv4-l);--b:var(--lv4-b)}.lv5{--l:var(--lv5-l);--b:var(--lv5-b)}
.pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pill{min-height:4.6rem;border-radius:16px;border:3px solid var(--line);background:var(--tile);font-size:1.3rem;font-weight:900;padding:6px}
.card{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:20px;border:3px solid var(--line);background:var(--tile)}
.card svg{width:3.2rem;height:3.2rem;flex-shrink:0}
.card .k{font-size:1.2rem;font-weight:500;color:var(--muted)}
.card .v{font-size:2rem;font-weight:900;line-height:1.3}
.card .t{font-size:1.5rem;font-weight:500;line-height:1.5}
.card b{font-weight:900}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{min-height:76px;border-radius:18px;border:3px solid var(--line);background:var(--tile);font-size:1.5rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}
.btn svg{width:1.8rem;height:1.8rem}
.btn.primary{background:var(--b-home);border-color:var(--b-home);color:#fff;font-weight:900}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:2px solid var(--divider);margin-top:16px;padding-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bar button{min-height:100px;border-radius:18px;border:none;color:var(--b-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:1.6rem;font-weight:900;padding:0}
.bar svg{width:2.3rem;height:2.3rem;stroke:#fff}
.bar .h{background:var(--b-home)}.bar .a{background:var(--b-again)}.bar .s{background:var(--b-stop)}
.safe{border-radius:16px;border:2px solid var(--safe-line);background:var(--safe-bg);padding:12px 16px}
.safe h2{margin:0 0 4px;font-size:1.35rem;font-weight:900;color:var(--safe-ink);display:flex;align-items:center;gap:8px}
.safe ul{margin:0;padding-left:1.3rem;font-size:1.15rem;font-weight:500;line-height:1.55}
.foot{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:8px;font-size:.95rem;color:var(--muted)}
.foot p{margin:0}
.note{font-size:1.1rem;color:var(--muted);text-align:center;margin:0}
.playing{display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.25rem;font-weight:700;color:var(--muted);min-height:1.8rem}
.playing svg{width:1.8rem;height:1.8rem}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding:14px 16px 16px;max-width:1200px;margin:0 auto}
.conf{flex:1;border-radius:24px;border:4px solid var(--conf-line);background:var(--conf-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:var(--ink)}
.conf svg.ic{width:6.5rem;height:6.5rem;stroke:var(--conf-line)}
.conf .big{font-size:3.6rem;font-weight:900;line-height:1.2}
.conf .tr{font-size:1.9rem;font-weight:700;color:var(--conf-ink);border-top:2px solid var(--conf-line);padding-top:12px;width:100%}
.conf .trl{font-size:1.1rem;color:var(--conf-ink)}
.conf img{max-width:100%;max-height:52vh;background:#fff;border-radius:12px}
.stamp{display:inline-block;margin-top:4px;font-size:1rem;color:var(--muted)}
canvas{width:100%;height:46vh;background:#fff;border:3px solid var(--line);border-radius:18px;touch-action:none}
.disp{min-height:5rem;border:3px solid var(--line);border-radius:16px;background:var(--tile);font-size:2.4rem;font-weight:900;display:flex;align-items:center;padding:0 16px;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.key{min-height:3.6rem;border-radius:12px;border:2px solid var(--line);background:var(--tile);font-size:1.6rem;font-weight:900}
.hp{display:flex;flex-direction:column;gap:14px;font-size:1.15rem}
.hp section{border:2px solid var(--line);border-radius:16px;padding:14px;background:var(--tile)}
.hp h2{margin:0 0 10px;font-size:1.4rem}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:52px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:transparent;font-size:1.15rem;font-weight:700}
.seg button.on{background:var(--b-home);border-color:var(--b-home);color:#fff}
.hp table{width:100%;border-collapse:collapse}
.hp td,.hp th{border-bottom:1px solid var(--divider);padding:8px 6px;text-align:left}
.hp textarea{width:100%;min-height:90px;font:inherit;font-size:1.2rem;border-radius:12px;border:2px solid var(--line);padding:10px;background:var(--bg);color:var(--ink)}
.stamps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.slot{aspect-ratio:1;border-radius:14px;border:2px dashed var(--divider);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent}
.slot.on{border:3px solid var(--sc);background:var(--tile)}
.slot svg{width:55%;height:55%}
.slot span{font-size:.7rem;font-weight:700;line-height:1.1;text-align:center}
.cardmsg{font-size:1.6rem;font-weight:900;text-align:center;padding:14px;border-radius:16px;background:var(--conf-bg);color:var(--ink);cursor:pointer}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;font-size:1.1rem;font-weight:700}
.legend span{display:flex;align-items:center;gap:6px}.legend svg{width:1.6rem;height:1.6rem}
@media (min-width:760px){.stamps{grid-template-columns:repeat(7,minmax(0,104px));justify-content:center;gap:14px}.slot span{font-size:.95rem}.cardmsg{font-size:2.1rem}}
.trow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.trow .title{margin:0}
.back{justify-self:start;min-height:56px;padding:0 16px 0 8px;border-radius:14px;border:3px solid var(--line);background:var(--tile);font-size:1.3rem;font-weight:900;display:flex;align-items:center;gap:4px;white-space:nowrap}
.back svg{width:1.9rem;height:1.9rem}
@media (min-width:760px){.back{min-height:68px;font-size:1.7rem;padding:0 22px 0 12px}.back svg{width:2.3rem;height:2.3rem}}
.bwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:46vh}
.bcircle{width:46vw;height:46vw;max-width:340px;max-height:340px;border-radius:50%;border:5px solid var(--c-relax);background:var(--tile);display:flex;align-items:center;justify-content:center;transform:scale(.6);transition:transform 3s ease-in-out}
.bcircle.in{transform:scale(1);transition-duration:3s}.bcircle.out{transform:scale(.6);transition-duration:6s}
.bcircle{flex-direction:column;gap:2px}
.bcircle span{font-size:2.2rem;font-weight:900;text-align:center;padding:0 10px;line-height:1.2}
.bcircle b{font-size:4.2rem;font-weight:900;line-height:1;color:var(--c-relax);font-variant-numeric:tabular-nums}
.bhint{text-align:center;margin:0;font-size:1.5rem;font-weight:700;color:var(--muted)}
.banner-h{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px 16px;border-radius:20px;background:var(--hosp-bg);border:2px solid var(--hosp)}
.bh-logo{width:min(320px,88%);height:auto;display:block}
body.night .bh-logo{background:#F7F4EC;border-radius:10px;padding:6px 10px}
.bh-div{display:block;width:72px;height:3px;border-radius:2px;background:var(--hosp)}
.bh-unit{font-size:2.1rem;font-weight:900;color:var(--hosp);letter-spacing:.12em}
@media (min-width:760px){.banner-h{flex-direction:row;justify-content:center;gap:28px;padding:22px 28px}.bh-logo{width:400px}.bh-div{width:3px;height:64px}.bh-unit{font-size:2.8rem}}
.soon .nw{white-space:nowrap}
.ib{display:inline-block}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 16px 24px;border-radius:24px;background:var(--hosp-bg);border:2px solid var(--hosp);text-align:center}
.hero-org{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;padding-bottom:10px;border-bottom:1.5px solid color-mix(in srgb,var(--hosp) 30%,transparent);width:100%}
.ho-logo{height:32px;width:auto;display:block}
body.night .ho-logo{background:#F7F4EC;border-radius:8px;padding:3px 6px}
.ho-div{width:2px;height:22px;border-radius:1px;background:var(--hosp);opacity:.5}
.ho-unit{font-size:1.15rem;font-weight:700;color:var(--hosp);letter-spacing:.1em}
.hero-n{margin:10px 0 0;font-size:clamp(3.6rem,17vw,6.4rem);font-weight:900;letter-spacing:.14em;padding-left:.14em;color:var(--hosp);line-height:1.05}
.hero-w{width:min(240px,64%);height:auto;display:block;color:var(--c-relax)}
.hero-s{margin:0;font-size:clamp(1.3rem,5vw,2rem);font-weight:900;color:var(--ink);line-height:1.35}
.hero-s .nw{white-space:nowrap}
@media (min-width:760px){.hero{padding:16px 28px 30px}.ho-logo{height:40px}.ho-unit{font-size:1.4rem}}
.soon{font-size:1rem;font-weight:700;line-height:1.35;color:#7A4100;background:#FFF0D4;border:2px solid #C9821F;border-radius:12px;padding:3px 8px}
body.night .soon{color:#FFD9A0;background:#3A2A12;border-color:#C9821F}
.banner{font-size:1rem;color:var(--muted);text-align:center;background:var(--safe-bg);border-radius:10px;padding:6px 10px;margin:0}
@media (min-width:760px){
  #app,.overlay{padding:24px 40px 28px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
  .grid.lgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.mgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .mgrid .tile{min-height:calc(12rem * var(--scale))}
  .mgrid .tile .lb{font-size:2.1rem}
  .tile{min-height:calc(13rem * var(--scale))}
  .tile svg{width:5rem;height:5rem}
  .tile .lb{font-size:2.5rem}
  .title h1{font-size:2.7rem}
  .lg-s{display:none!important}.lg-h{display:block!important;height:54px}
  .top-l{gap:28px}
  .clock{font-size:1.6rem}
  .bar button{min-height:112px;flex-direction:row;gap:14px;font-size:2.2rem}
  .bar svg{width:2.9rem;height:2.9rem}
  .lvls.h{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
  .lvls.h .lvl{flex-direction:column;justify-content:center;min-height:17rem;padding:12px;text-align:center}
  .lvls.h .lvl svg{width:5.5rem;height:5.5rem}
  .lvls.h .lvl span{font-size:1.9rem}
  .conf{flex-direction:row;gap:48px}
  .conf .txt{text-align:left}
  .conf svg.ic{width:11rem;height:11rem}
  .conf .big{font-size:6rem}
  .conf .tr{font-size:2.8rem}
  .keys{grid-template-columns:repeat(10,minmax(0,1fr))}
  .pill{font-size:1.7rem;min-height:5.5rem}
  .card .v{font-size:2.8rem}.card .t{font-size:2.1rem}.card svg{width:4.6rem;height:4.6rem}
  .row2 .btn{min-height:96px;font-size:2rem}
}
@media (max-width:759px){ .row2.stk{grid-template-columns:1fr} }
@media (min-width:760px){ .lvls.h .lvl span{font-size:1.6rem} }
</style>
</head>

function listTiles(key, act){
  const l = L[key]; const items = l.items;
  if (items.length <= 6) return items.map((it,i) => tile(act, `${key}|${i}`, it.ic, lab(it), l.c)).join('');
  const per = 5, pages = Math.ceil(items.length/per), pg = (st.page[key]||0) % pages;
  const shown = items.slice(pg*per, pg*per+per).map((it,j) => tile(act, `${key}|${pg*per+j}`, it.ic, lab(it), l.c)).join('');
  return shown + tile('page', key, 'dots', `${u('more')} ${pg+1}/${pages}`, l.c, 'more');
}

let lastTap = {k:'', t:0};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  unlockAudio();
  const a = b.dataset.a, g = b.dataset.g || '';
  const sayNow = b.dataset.say, sayLang = TTS[st.lang||'zh'];
  const key = a+'|'+g, now = Date.now();
  if (key===lastTap.k && now-lastTap.t < 700 && !['key','keyDel','page'].includes(a)) return;
  lastTap = {k:key, t:now};
  b.classList.add('flash'); setTimeout(()=>b.classList.remove('flash'), 250);
  if (navigator.vibrate) try { navigator.vibrate(30); } catch(_){}
  if (sayNow) setTimeout(()=>speak(sayNow, sayLang, true), 0);
  switch (a) {
    case 'pickLang': {
      st.lang = g;
      const sample = {zh:'你選擇了中文', tw:'你選擇了台語', hak:'你選擇了客語', en:'You chose English', id:'Anda memilih Bahasa Indonesia', vi:'Bạn đã chọn tiếng Việt'}[g];
      render(); speak(sample); break; }
    case 'go': go(g); break;
    case 'toLang': st.lang=null; go('lang'); break;
    case 'back': { const fm = document.getElementById('fm'); if (fm) st.familyMsg = fm.value; back(); break; }
    case 'orientSpeak': speak(orientSpeech()); break;
    case 'home': stopAll(); st.stack = []; go('menu', false); break;
    case 'again': if (st.screen==='storyPlay') storyPlay(st.story); else { const L = st.last; speak(u('again'), null, true); if (L) queueSpeak(L.text, L.lang); } break;
    case 'stop': stopAll(); render(); break;
    case 'amb': if (st.ambKey===g) ambStop(); else ambPlay(g); render(); break;
    case 'story': nav('storyPlay', {story:+g}); setTimeout(()=>storyPlay(+g), 300); break;
    case 'breathToggle': if (st.breathOn) { breathStop(); stopSpeak(); } else breathStart(); break;
    case 'explainSpeak': speak(u('eExplain').replace(/<br>/g,' ')); break;
    case 'cheer': { const items = L.cheer.items; const it = items[Math.floor(Math.random()*items.length)];
      confirmSay({ic:it.ic, big:sent(it), tr:'', speak:sent(it)}); break; }
    case 'cardSpeak': speak(cardMsg()); break;
    case 'stamp': { const fm = document.getElementById('fm'); if (fm) st.familyMsg = fm.value; st.stamps.push(g); record(`集點卡：${{done:'有練習',rest:'休息章',back:'歡迎回來章'}[g]}`); render(); break; }
    case 'unstamp': { const fm = document.getElementById('fm'); if (fm) st.familyMsg = fm.value; st.stamps.pop(); render(); break; }
    case 'goal': { const fm = document.getElementById('fm'); if (fm) st.familyMsg = fm.value; st.goalsDone[+g] = !st.goalsDone[+g]; render(); break; }
    case 'testTTS': { const d = document.getElementById('diag'); const msg = t => { if (d) d.textContent = t; };
      if (!('speechSynthesis' in window)) { msg('這個瀏覽器不支援語音朗讀。'); break; }
      msg('已按下，正在送出朗讀…');
      try { if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); speechSynthesis.resume();
        const ut = new SpeechSynthesisUtterance('聲音測試，你聽得到嗎？'); ut.lang = 'zh-TW';
        const v = voices.find(v => v.lang.replace('_','-')==='zh-TW') || voices.find(v => /^zh/i.test(v.lang)); if (v) ut.voice = v;
        let started = false;
        ut.onstart = () => { started = true; msg('朗讀已開始（語音：' + (ut.voice ? ut.voice.name : '預設') + '）。若此時沒聽到聲音，代表聲音被裝置或頁面擋住。'); };
        ut.onend = () => msg((started ? '朗讀完成。' : '朗讀結束但沒有開始播放。') + '若沒聽到聲音，代表聲音被裝置或頁面擋住。');
        ut.onerror = e => msg('朗讀失敗，錯誤代碼：' + (e.error || '未知') + '。' + (e.error==='not-allowed' ? '瀏覽器或頁面不允許播放聲音。' : ''));
        speechSynthesis.speak(ut);
        setTimeout(() => { if (!started) msg('按下 2 秒後朗讀仍未開始：瀏覽器沒有執行朗讀，最可能是頁面框架擋住了聲音。'); }, 2000);
      } catch (err) { msg('朗讀發生錯誤：' + err.message); }
      break; }
    case 'testBeep': { const d = document.getElementById('diag'); actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume();
      setTimeout(() => { if (d) d.textContent = '嗶聲已送出，音訊狀態：' + actx.state + (actx.state==='running' ? '（正常；若沒聽到，請檢查靜音開關與音量）' : '（被暫停，代表瀏覽器或頁面不允許播放聲音）'); }, 400);
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime; o.frequency.value = 660; g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.6); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.65); break; }
    case 'closeConf': stopSpeak(); st.conf = null; render(); break;
    case 'list': nav('list', {list:g}); break;
    case 'page': st.page[g] = (st.page[g]||0)+1; render(); break;
    case 'say': { const [k,i] = g.split('|'); sayItem(L[k].items[+i]); break; }
    case 'painUnknown': nav('painLevel', {painItem: PAIN_UNKNOWN}); break;
    case 'painItem': { const [k,i] = g.split('|'); nav('painLevel', {painItem: L[k].items[+i]}); break; }
    case 'lvl': { const [kind,i] = g.split('|'); const t = LV[kind][+i]; const score = [0,2,4,6,8,10][+i];
      if (kind==='pain') { const it = st.painItem;
        const big = `${lab(it)}<br>${t[P()]}`;
        const tr = careDiff()? `${careText(it)}${st.care==='zh'?'，':' – '}${t[LI[st.care]]}` : '';
        confirmSay({ic:'f'+i, big, tr, speak:`${sayText(lab(it))}，${t[P()]}`}); record(`${it.zh}：${t[0]}`, score);
      } else { confirmSay({ic:'f'+i, big:t[P()], tr: careDiff()?t[LI[st.care]]:'', speak:t[P()]}); record(`喘：${t[0]}`, score); }
      break; }
    case 'cmp': { const c = CMP[+g]; confirmSay({ic:'lungs', big:c[P()], tr:careDiff()?c[LI[st.care]]:'', speak:c[P()]}); record(c[0]); break; }
    case 'famMsg': { const m = st.familyMsg.trim() || u('noMsg'); confirmSay({ic:'msg', big:m, tr:'', speak:m}); break; }
    case 'cvClear': initCanvas(true); break;
    case 'cvShow': { const cv = document.getElementById('cv'); if (!cv) break; st.conf = {img: cv.toDataURL('image/png')}; record('（手寫內容）'); render(); break; }
    case 'key': st.spell += g; render(); break;
    case 'keyDel': st.spell = st.spell.slice(0,-1); render(); break;
    case 'keyClr': st.spell = ''; render(); break;
    case 'spellShow': if (st.spell.trim()) { confirmSay({ic:'abc', big:st.spell, tr:'', speak:st.spell}); record(`拼字：${st.spell}`); } break;
    case 'helper': stopSpeak(); go('helper'); break;
    case 'helperBack': { const fm = document.getElementById('fm'); if (fm) st.familyMsg = fm.value; back(); break; }
    case 'set': { const fm = document.getElementById('fm'); if (fm) st.familyMsg = fm.value;
      const [k,v] = g.split('|'); st[k] = v==='true'?true:v==='false'?false:(k==='rate'?+v:v); render(); break; }
  }
});

/* ---------- 手寫板 ---------- */
function initCanvas(clear){
  const cv = document.getElementById('cv'); if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (!cv.dataset.ready || clear) {
    cv.width = r.width*dpr; cv.height = r.height*dpr;
    const ctx = cv.getContext('2d'); ctx.scale(dpr,dpr); ctx.fillStyle='#fff'; ctx.fillRect(0,0,r.width,r.height);
    ctx.lineWidth = 7; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1A1A1A';
  }
  if (cv.dataset.ready) return; cv.dataset.ready = '1';
  const ctx = cv.getContext('2d'); let down = false;
  const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
  cv.addEventListener('pointerdown', e => { down = true; cv.setPointerCapture(e.pointerId); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+.1,y+.1); ctx.stroke(); });
  cv.addEventListener('pointermove', e => { if(!down) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); });
  ['pointerup','pointercancel','pointerleave'].forEach(t => cv.addEventListener(t, () => down = false));
}

setInterval(() => { const d = new Date();
  document.querySelectorAll('[data-clock]').forEach(el => el.textContent = timeStr(d));
  document.querySelectorAll('[data-otime]').forEach(el => el.textContent = `${period(d.getHours())} ${hm(d)}`);
  document.querySelectorAll('[data-odate]').forEach(el => el.textContent = dateStr(d));
  document.querySelectorAll('[data-owd]').forEach(el => el.textContent = WD[P()][d.getDay()]); }, 15000);
render();
</script>
